version: "2"
# golangci-lint runs with this file twice: in the shared Quality workflow
# (luthersystems/.github, quality / lint) and, for gosec, in the shared
# Security workflow (security / gosec).
linters:
  settings:
    errcheck:
      # mars is a CLI. These print to its stdout and stderr, and a failed
      # write to either leaves nothing better to do than go on.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests write fixtures to t.TempDir() and read them back, by path. File
      # permissions and file inclusion there guard nothing: the files are the
      # test's own, in a directory only the test uses.
      - path: '_test\.go$'
        linters:
          - gosec
        text: "G301|G304|G306"
