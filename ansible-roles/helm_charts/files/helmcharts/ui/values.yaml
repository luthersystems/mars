# Default values for ui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  orgName: luther
  projectEnv: ""
  partOf: app
  identity:
    name: ""
    resourceId: ""
    clientId: ""

replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ports:
  app: 9090

secure: true

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

config: !!null

# Pod security context. RuntimeDefault applies the container runtime's
# seccomp profile, which blocks the syscalls an ordinary server never makes
# (kernel module loads, mount, ptrace and the like). Without it EKS runs
# pods unconfined. Trivy KSV-0118 flags a pod with no security context.
# Override it here if an image needs more. The container context stays in
# the template.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
