global:
  partOf: app

replicaCount: 1

image:
  repository: luthersystems/insideout-mcp
  tag: latest
  pullPolicy: IfNotPresent

mcp:
  transport: "http"
  addr: ":8080"
  path: "/mcp"
  baseUrl: "https://insideout.luthersystemsapp.com"

# Environment variables for the insideout-mcp server
env:
  MCP_VERBOSE: "true"
  MCP_DEVTOOLS_ENABLED: "false"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}
  grpc:
    enabled: false
    port: 9090
    targetPort: 9090
    annotations: {}

resources: {}
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
nodeSelector: {}
tolerations: []
affinity: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths: []
  tls: []


# Pod security context. RuntimeDefault applies the container runtime's
# seccomp profile, which blocks the syscalls an ordinary server never makes
# (kernel module loads, mount, ptrace and the like). Without it EKS runs
# pods unconfined. Trivy KSV-0118 flags a pod with no security context.
# Override it here, not in the template, if an image needs more.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Container security context. allowPrivilegeEscalation: false stops a
# process from gaining more rights than it started with (setuid binaries,
# file capabilities); the server needs neither. Trivy KSV-0118 flags a
# container with no security context.
securityContext:
  allowPrivilegeEscalation: false
