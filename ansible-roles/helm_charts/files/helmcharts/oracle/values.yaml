# Default values for oracle.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  partOf: app

replicaCount: 1

component: oracle

app:
  name: oracle

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# The name of a secret. Only one secret may be given so that it may be defined
# via a helm --set option and to avoid precedence issues.
envFromSecret: ""

# A map of environment variables that can override envFromSecret
env: {}

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ports:
  app: 8080
  metrics: 9600

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

httpOnlyProbe: true

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: false
  permissions: []

# Pod security context. RuntimeDefault applies the container runtime's
# seccomp profile, which blocks the syscalls an ordinary server never makes
# (kernel module loads, mount, ptrace and the like). Without it EKS runs
# pods unconfined. Trivy KSV-0118 flags a pod with no security context.
# Override it here, not in the template, if an image needs more.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Container security context. allowPrivilegeEscalation: false stops a
# process from gaining more rights than it started with (setuid binaries,
# file capabilities); the server needs neither. Trivy KSV-0118 flags a
# container with no security context.
securityContext:
  allowPrivilegeEscalation: false
