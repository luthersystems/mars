global:
  partOf: app

replicaCount: 1

image:
  repository: luthersystems/agent-builder
  tag: latest
  pullPolicy: IfNotPresent

mcp:
  transport: "http"
  addr: ":8080"
  path: "/mcp"
  baseUrl: "https://insideout.luthersystemsapp.com"

# Environment variables for the agent-builder server
env:
  MCP_VERBOSE: "true"
  MCP_DEVTOOLS_ENABLED: "false"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources: {}
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
nodeSelector: {}
tolerations: []
affinity: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths: []
  tls: []


# Pod and container security contexts. They are empty here on purpose: this
# chart starts the MCP servers an agent uses as child processes, and a
# browser-based server (Playwright, Puppeteer) needs the user namespaces
# that seccomp RuntimeDefault blocks, or a setuid sandbox that
# allowPrivilegeEscalation: false blocks. Set them per deploy once its
# servers are known to run under them, for example:
#   podSecurityContext: {seccompProfile: {type: RuntimeDefault}}
#   securityContext: {allowPrivilegeEscalation: false}
# Trivy KSV-0118 flags the empty contexts; the exemption row says why.
podSecurityContext: {}

securityContext: {}
