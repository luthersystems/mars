global:
  partOf: app

replicaCount: 1

image:
  # The hardened supergateway image with uvx (luthersystems/connectorhub
  # docker/Dockerfile.supergateway-uvx-git): supercorp/supergateway:3.4.3-uvx
  # with git, the CA bundle and the build-harden kit.
  repository: luthersystems/supergateway-uvx-git
  tag: 3.4.3-2
  pullPolicy: IfNotPresent

# Command that Supergateway runs in stdio mode
# This stays as ONE string arg after --stdio
stdioCommand: "uvx awslabs.aws-pricing-mcp-server@latest"

supergateway:
  port: 8000
  ssePath: /sse
  messagePath: /message
  healthPath: /healthz
  baseUrl: "" # e.g., "http://0.0.0.0:8000" (optional)
  cors: true # enable CORS; good for local/dev
  logLevel: info
  oauth2Bearer: "" # if you call out to remote SSE/HTTP servers
  headers: [] # e.g., ["X-API-Key: abc123", "X-Another: value"]

# Environment for the spawned MCP server (and/or gateway)
# Typically you’ll set region + rely on IRSA via serviceAccount annotations.
env:
  AWS_REGION: "us-west-2"
  FASTMCP_LOG_LEVEL: "INFO"

service:
  type: ClusterIP
  port: 80

resources: {}
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod and container security contexts. They are empty here on purpose: this
# chart runs whatever MCP server `stdioCommand` names (any uvx or npx
# package), and a browser-based server (Playwright, Puppeteer) needs the
# user namespaces that seccomp RuntimeDefault blocks, or a setuid sandbox
# that allowPrivilegeEscalation: false blocks. Set them per deploy once its
# servers are known to run under them, for example:
#   podSecurityContext: {seccompProfile: {type: RuntimeDefault}}
#   securityContext: {allowPrivilegeEscalation: false}
# Trivy KSV-0118 flags the empty contexts; the exemption row says why.
podSecurityContext: {}

securityContext: {}
