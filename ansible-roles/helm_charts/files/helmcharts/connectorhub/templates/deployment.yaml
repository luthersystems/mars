apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "connectorhub.fullname" . }}
  labels:
{{ include "connectorhub.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if and .Values.leaderElection.enabled (gt (int .Values.replicaCount) 1) }}
  # Start the new pod before the old one stops, so a standby is always up.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "connectorhub.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "connectorhub.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        rollout-nonce: {{ .Values.global.forceRedeployNonce | default "" | quote }}
    spec:
      securityContext:
        runAsUser: 6553
        fsGroup: 65534 # chown pvc mounts
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- /* With leader election the checkpoint is on the Lease. */}}
        {{- if not .Values.leaderElection.enabled }}
        - name: connectorhub-checkpoint
          persistentVolumeClaim:
            claimName: {{ list "storage" . | include "connectorhub.pvc" }}
        {{- end }}
        - name: fabric-artifacts
          emptyDir: {}
        - name: msp
          emptyDir: {}
        - name: state-store
          emptyDir: {}
        {{- if .Values.dlt.cryptoConfigSecret }}
        - name: connectorhub-crypto-config
          secret:
            secretName: connectorhub-crypto-config
        {{- end }}
        {{- if .Values.sdk.secretName }}
        - name: config
          secret:
            secretName: {{ .Values.sdk.secretName | quote }}
        {{- else if .Values.sdk.configMapName }}
        - name: config
          configMap:
            name: {{ .Values.sdk.configMapName | quote }}
        {{- end }}
      {{- if not .Values.local }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "connectorhub.name" . }}
        # Put a standby hub on another node when there is one, so a node loss
        # (a spot reclaim) does not stop both hubs. ScheduleAnyway: a
        # one-node cluster still runs every replica.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "connectorhub.name" . }}
      {{- end }}
      serviceAccountName: {{ include "connectorhub.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - start
            - --config-file=/tmp/fabric/connectorhub.yaml
            {{- if not .Values.leaderElection.enabled }}
            - --checkpoint-file=/tmp/checkpoint/checkpoint.txt
            {{- end }}
            {{- if .Values.verbose }}
            - --verbose
            {{- end }}
          env:
            {{- /* connectorhub reads POD_NAMESPACE to manage the MCP pods it launches. */}}
            {{- if not (hasKey (.Values.env | default dict) "POD_NAMESPACE") }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- /* The hub sets this Deployment as the owner of the MCP connectors
            it launches, so an uninstall removes them (connectorhub#212).
            Older hubs ignore it. */}}
            {{- if not (hasKey (.Values.env | default dict) "CH_MCP_OWNER_DEPLOYMENT") }}
            - name: CH_MCP_OWNER_DEPLOYMENT
              value: {{ include "connectorhub.fullname" . | quote }}
            {{- end }}
            {{- with .Values.leaderElection }}
            {{- if .enabled }}
            {{- $env := $.Values.env | default dict }}
            {{- /* Without election the hub would run with no checkpoint, and
                   every replica would handle every event. */}}
            {{- if and (hasKey $env "CH_HUB_LEADER_ELECTION") (ne (toString (get $env "CH_HUB_LEADER_ELECTION")) "true") }}
            {{- fail "leaderElection.enabled needs env.CH_HUB_LEADER_ELECTION unset or \"true\"" }}
            {{- end }}
            {{- if not (hasKey $env "CH_HUB_LEADER_ELECTION") }}
            - name: CH_HUB_LEADER_ELECTION
              value: "true"
            {{- end }}
            {{- if not (hasKey $env "CH_HUB_LEADER_ELECTION_LEASE_NAME") }}
            - name: CH_HUB_LEADER_ELECTION_LEASE_NAME
              value: {{ .leaseName | default (include "connectorhub.fullname" $) | quote }}
            {{- end }}
            {{- if .podLabel }}
            {{- if not (hasKey $env "CH_HUB_LEADER_ELECTION_POD_LABEL") }}
            - name: CH_HUB_LEADER_ELECTION_POD_LABEL
              value: "true"
            {{- end }}
            {{- if not (hasKey $env "POD_NAME") }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.env }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.verbose }}
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_GO_LOG_SEVERITY_LEVEL
              value: info
            {{- end }}
          workingDir: /tmp/fabric
          volumeMounts:
            - name: fabric-artifacts
              mountPath: /tmp/fabric
            {{- if not .Values.leaderElection.enabled }}
            - name: connectorhub-checkpoint
              mountPath: /tmp/checkpoint
            {{- end }}
            - name: msp
              mountPath: /tmp/msp
            - name: state-store
              mountPath: /tmp/state-store
            {{- if or .Values.sdk.secretName .Values.sdk.configMapName }}
            - name: config
              subPath: connectorhub.yaml
              mountPath: /tmp/fabric/connectorhub.yaml
              readOnly: true
            - name: config
              subPath: fabric-client.yaml
              mountPath: /tmp/fabric/fabric-client.yaml
              readOnly: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.main }}
              protocol: TCP
            {{- if .Values.service.test.enabled }}
            - name: test-api
              containerPort: {{ .Values.ports.test }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/ch/health_check
              port: http
          readinessProbe:
            httpGet:
              path: /v1/ch/health_check
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      initContainers:
        {{- if .Values.dlt.cryptoConfigSecret }}
        - name: config-setup
          image: busybox:1.35.0
          args:
            - sh
            - -c
            - |
              set -xe;
              cp /opt/crypto-config/crypto-config.zip /tmp
              cd /tmp
              unzip crypto-config.zip
              mkdir -p /fabric/crypto-config
              cp -a crypto-config/. /fabric/crypto-config/
              {{- with .Values.dlt.keepKeysOnlyForOrg }}
              # Delete every private key except this org's user keys.
              find /fabric/crypto-config -type f \( -name '*_sk' -o -name '*.key' -o -path '*/keystore/*' \) ! -path '/fabric/crypto-config/peerOrganizations/{{ . }}/users/*' -print -delete
              {{- end }}
          volumeMounts:
            - name: fabric-artifacts
              mountPath: /fabric
            - name: connectorhub-crypto-config
              mountPath: /opt/crypto-config
              readOnly: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
