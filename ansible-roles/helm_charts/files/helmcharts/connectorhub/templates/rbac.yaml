{{- if .Values.rbac.create }}

# Grant connectorhub SA the ability to manage pods & subresources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "connectorhub.fullname" . }}-launcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "connectorhub.labels" . | nindent 4 }}
rules:
  # Pods: create, delete, get/list/watch (for status)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create","delete","get","list","watch"]
  # Pod subresources: exec, logs, attach
- apiGroups: [""]
  resources: ["pods/exec","pods/log","pods/attach"]
  verbs: ["create","get"]
  # Secrets: upsert your in-memory files
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","list","watch","create","update","patch","delete"]
  # Services: check existence and manage connector services
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "update", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # NetworkPolicies: one per MCP connector, created and repaired by the
  # launcher to block cloud metadata egress (luthersystems/connectorhub#190).
  # Without this, connectorhub >= the #192 release refuses to start new
  # connectors (fail closed) unless CH_K8S_BLOCK_METADATA=false.
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create", "update", "delete"]
  # ServiceAccounts: read-only, so the launcher can warn when the connector
  # pods' ServiceAccount carries an IRSA/Workload Identity annotation.
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get"]
{{- if .Values.leaderElection.enabled }}
  # Leases: hub leader election and its checkpoint annotation
  # (luthersystems/connectorhub#203).
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
{{- if .Values.leaderElection.podLabel }}
  # Pods: the hub labels its own pod with its role.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["patch"]
{{- end }}
{{- end }}

---
# Bind that Role to your ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "connectorhub.fullname" . }}-launcher-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "connectorhub.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "connectorhub.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "connectorhub.fullname" . }}-launcher
  apiGroup: rbac.authorization.k8s.io

{{- end }}
