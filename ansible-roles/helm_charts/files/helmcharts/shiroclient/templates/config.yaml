{{- /*
The gateway config: shiroclient.yaml, fabric-client.yaml (with the CA
registrar's enrollSecret), and config.json.b64 and phylum.zip when set.
A Secret by default, sdk.secretName (Trivy KSV-0109, mars#322). Every key is
under data, base64, so a key dropped in an upgrade leaves the live Secret
too. sdk.configMapName renders the old ConfigMap instead, with the same keys.
*/}}
{{- $name := include "shiroclient.configName" . }}
{{- if $name }}
{{- $secret := not .Values.sdk.configMapName }}
apiVersion: v1
{{- if $secret }}
kind: Secret
type: Opaque
{{- else }}
kind: ConfigMap
{{- end }}
metadata:
  name: {{ $name }}
{{- if and .Values.sdk.phylumZipBase64 (not $secret) }}
binaryData:
  phylum.zip: {{ .Values.sdk.phylumZipBase64 }}
{{- end }}
data:
  {{- if $secret }}
  {{- with .Values.sdk.phylumZipBase64 }}
  phylum.zip: {{ . }}
  {{- end }}
  {{- with .Values.sdk.bootstrapBase64 }}
  config.json.b64: {{ . | b64enc }}
  {{- end }}
  shiroclient.yaml: {{ include "shiroclient.shiroclientYaml" . | b64enc }}
  fabric-client.yaml: {{ include "shiroclient.fabricClientYaml" . | b64enc }}
  {{- else }}
  {{- with .Values.sdk.bootstrapBase64 }}
  config.json.b64: {{ . }}
  {{- end }}
  shiroclient.yaml: |
    {{- include "shiroclient.shiroclientYaml" . | nindent 4 }}
  fabric-client.yaml: |
    {{- include "shiroclient.fabricClientYaml" . | nindent 4 }}
  {{- end }}
{{- end }}
