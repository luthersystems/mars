# Default values for shiroclient.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

global:
  projectEnv: dev

runMode: gateway

# Extra environment variables for the shiroclient container, as a list of
# Kubernetes EnvVar objects (name/value or name/valueFrom). Empty adds none.
# Example: point license metrics at a staging endpoint (substrate >= v2.245.0):
#   extraEnv:
#     - name: SHIROCLIENT_METRICS_URL
#       value: https://metrics-staging.luthersystemsapp.com/metrics
extraEnv: []

# Writable license state directory (luthersystems/mars#282). When enabled,
# the gateway gets an emptyDir volume at mountPath and
# SHIROCLIENT_LICENSE_STATE_DIR set to it, so it stores each renewed license
# there (renewed-license.yaml). A container restart during a metrics server
# outage then starts with the stored renewal instead of an expired license
# file. An emptyDir survives container restarts, not a new pod. Needs a
# shiroclient with luthersystems/substrate#729; older ones ignore the env var.
# Off by default: the gateway then uses its 1-hour start-up grace window.
#   enabled:   true adds the volume, the mount and the env var.
#   mountPath: where the volume is mounted; SHIROCLIENT_LICENSE_STATE_DIR.
#   sizeLimit: optional emptyDir size limit (for example 1Mi). Empty: none.
licenseState:
  enabled: false
  mountPath: /var/lib/shiroclient/license
  sizeLimit: ""

dlt:
  organization: org1
  domain: luther.systems
  cryptoConfigSecret: ""
  # Set to an org domain (e.g. org1.luther.systems) to delete every private
  # key in crypto-config except that org's user keys. Empty keeps all keys.
  keepKeysOnlyForOrg: ""

sdk:
  txTimeout: 60s
  txCommitTimeout: 60s
  txRetryMinDelay: 50ms
  txRetryMaxDelay: 2s
  configMapName: shiroclient-config
  bootstrapBase64: ""
  phylumZipBase64: ""
  peerResponseTimeout: 5s
  # Settings written to shiroclient.yaml and fabric-client.yaml in the
  # configMapName config map.
  chaincodeID: com_luthersystems_chaincode_substrate01
  channel: luther
  minEndorsers: 1
  peerUsername: Admin
  logLevel: info
  network:
    org: org1
    mspID: Org1MSP
    domain: luther.systems
    # Empty means the orderer org shares domain.
    ordererDomain: ""
    peer: peer0
    orderer: orderer0
    peerPort: 7051
    peerEventPort: 7053
    ordererPort: 7050
    caPort: 7054
    caRegistrar:
      enrollID: admin
      enrollSecret: adminpw

image:
  repository: luthersystems/shiroclient
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ports:
  app: 8082
  metrics: 9602

# startupProbe holds off the liveness and readiness probes until the gateway
# opens its metrics port. A slow start-up then does not cause a restart loop.
# The default allows 180s (36 x 5s). Set startupProbe: null to turn it off.
# A handler here (httpGet, exec, tcpSocket, grpc) replaces the default
# httpGet on /metrics.
startupProbe:
  periodSeconds: 5
  failureThreshold: 36

# The calling role must set these values, which are different for each project.
aws: {}
#  accessKeyID: ""
#  secretAccessKey: ""
#  sessionToken: ""
#  region: eu-central-1
#  phylumBucket: ""
#  envBucket: ""

# The calling role must set these values, which are different for each project.
phylum: {}
#  name: ics
#  version: 0.1.0-1fee1ba

substrate:
  version: 2.96.0
  s3:
    region: eu-west-2
    bucket: luther-common-ln-common-external-s3-44lp
  license: ""

ingress:
  enabled: false
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []

  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

verbose: false

awsCLIVersion: latest

local: false

serviceAccount:
  create: false
  annotations: {}
  name: ""
