---
# defaults file for k8s_fabric_peer

k8s_fabric_peer_org: org1
k8s_fabric_peer_msp: Org1MSP
k8s_fabric_peer_org_size: 1
k8s_fabric_peer_domain_root: "{{k8s_fabric_network_domain_root}}"
# Orderer org domain; empty means it shares the domain root.
k8s_fabric_peer_orderer_domain_root: "{{ k8s_fabric_network_orderer_domain_root | default('') }}"
k8s_fabric_peer_namespace: fabric-{{k8s_fabric_peer_org}}
k8s_fabric_peer_helm_chart_path: "{{kubectl_asset_root_path}}/fabric-peer"
k8s_fabric_peer_image_repository: hyperledger/fabric-peer
k8s_fabric_peer_start_service: true
k8s_fabric_peer_start_probes: true
# Probe timing overrides, merged into the chart's probes values (see
# files/fabric-peer/values.yaml for the defaults and why they are set). Empty
# keeps the chart defaults. Set only the fields to change, for example
# {liveness: {failureThreshold: 5}}; Helm keeps the other fields.
# {liveness: null} turns the liveness probe off.
k8s_fabric_peer_probes: {}
k8s_fabric_peer_chaincode_invoke_timeout: 5s
k8s_fabric_peer_chaincode_memory_limit: 4294967296 # 4Gi
k8s_fabric_peer_storage_size: 10Gi
# Storage class of the peer volume claims. On AWS it must match the class of
# the volumes Terraform makes (tf-modules eks-ebs-persistentvolume-set), which
# the claims bind by label; it does not set the EBS type. To change the type
# of an existing volume, use k8s_fabric_peer_volume_type_override.
k8s_fabric_peer_storage_class: gp2
# EBS volume type to set on the peer volume claims (annotation
# ebs.csi.aws.com/volumeType), for example gp3; the Docker storage claim
# gets it too. The EBS CSI driver changes the volume in place and online; AWS
# allows one change in 6 hours, and sc1 needs 125 GiB or more. On a 125 GiB
# test volume, a peer on sc1 committed blocks 90 times slower than on gp3
# (larger sc1 volumes are faster), so use gp3 unless cost matters more than
# speed. Measurements and cost:
# https://docs.luthersystems.com/deployment/peer-storage
k8s_fabric_peer_volume_type_override: ""
k8s_fabric_peer_dockerstorage_size: 10Gi
# Tiered ledger storage (the chart's blockArchive): a block-archiver sidecar
# (fabric-snapshot-archiver archive-blocks, the same image and version as
# k8s_fabric_peer_snapshot_archiver_version) moves sealed block files to a
# second PVC and leaves symlinks, so the storage PVC can be small and fast
# (gp3) and the archive large and cheap (sc1, 125Gi minimum). Each peer's
# archive PVC is blockarchive-fabric-peer<N>-<org>. No peer restart is
# needed for a pass; turning it on restarts the peer once (new volume).
k8s_fabric_peer_block_archive: false
k8s_fabric_peer_block_archive_storage_size: 125Gi
k8s_fabric_peer_block_archive_storage_class: "{{k8s_fabric_peer_storage_class}}"
k8s_fabric_peer_block_archive_volume_type_override: sc1
k8s_fabric_peer_block_archive_interval: 60s
# Copy rate limit in MiB/s (0: none), so the first pass of a large ledger
# does not take the disk from the peer. sc1 gives 12 MiB/s per TiB base.
k8s_fabric_peer_block_archive_max_mb_per_second: 20
k8s_fabric_peer_log_level: INFO
k8s_fabric_peer_pv_selectors:
  - app.kubernetes.io/component=bcpeer
  - type=storage
k8s_fabric_peer_separate_pvc: false
k8s_fabric_peer_lb_idle_timeout: 60
k8s_fabric_peer_use_nlb: true
k8s_fabric_peer_service_type: ClusterIP
k8s_fabric_peer_azs: []
k8s_fabric_peer_substrate_version: ""
k8s_fabric_peer_cert_bucket: ""
k8s_fabric_peer_cert_bucket_region: ""
k8s_fabric_peer_configmap_path: "{{kubectl_asset_root_path}}/static_resources/{{luther_env}}/{{k8s_fabric_peer_namespace}}/fabric-peer.yaml"
k8s_fabric_peer_docker_socket: "unix:///var/run/docker.sock"
k8s_fabric_peer_docker_log_options:
  max-size: "50m"
  max-file: "5"
k8s_fabric_peer_docker_log_driver: json-file
k8s_fabric_peer_buildpack_version: ""
k8s_fabric_peer_chaincode_external: false
k8s_fabric_peer_chaincode_ccaas: false
k8s_fabric_peer_chaincode_docker: true
k8s_fabric_peer_log_grpc: false
k8s_fabric_peer_version: "{{k8s_fabric_version}}"
# Fabric 3.x chaincode.runtimeParams in core.yaml (the peer leaves them out
# for 2.x). The values are the Fabric 3.1 defaults; they let a shim batch its
# writes and multi-key reads (luthersystems/substrate#1033). Set
# useWriteBatch or useGetMultipleKeys to false to fall back to one message per
# key if a chaincode misbehaves with them. Set only the keys you change: the
# template merges them over k8s_fabric_peer_chaincode_runtime_params_defaults.
k8s_fabric_peer_chaincode_runtime_params: {}
k8s_fabric_peer_chaincode_runtime_params_defaults:
  useWriteBatch: true
  maxSizeWriteBatch: 1000
  useGetMultipleKeys: true
  maxSizeGetMultipleKeys: 1000
k8s_fabric_peer_crypto_config: ""
k8s_fabric_peer_crypto_config_secret_name: ""
k8s_fabric_peer_aws_cli_version: "{{ luther_buildenv_images_version }}"
# Pinned on its own, not to luther_buildenv_images_version: a dind bump
# changes the Docker that builds and runs chaincode and upgrades the peer's
# /var/lib/docker volume in place, so it gets its own test. v0.1.43 and
# later are Docker 28.5.2 (v0.1.42 was 19.03.14); v0.1.45 and later also run
# the build-harden kit. Docker 29 breaks Fabric 2.5 chaincode builds
# (luthersystems/buildenv#161). smoke-helm-charts.sh checks the chart default
# equals it.
k8s_fabric_peer_dind_version: v0.1.46
# luthersystems/buildenv tag of the Docker chaincode images: fabric-ccenv
# (the chaincode build image) for Fabric 2.2, 2.4 and 2.5, and fabric-baseos
# (the Go chaincode runtime) for 2.2 and 2.4. They are the upstream images
# with the eMudhra (emSign) certificates blocked (CVE-2026-111943,
# luthersystems/mars#319). Pinned on its own, like dind: it changes the image
# that builds chaincode, so a bump gets its own test. Empty keeps the upstream
# hyperledger images. The chart default must equal it (smoke-helm-charts.sh).
k8s_fabric_peer_chaincode_images_version: v0.1.48
# Full image references that replace the default build image or Go runtime
# image. Empty uses k8s_fabric_peer_chaincode_images_version.
k8s_fabric_peer_chaincode_builder_image: ""
k8s_fabric_peer_chaincode_golang_runtime_image: ""

# Add the fabric-snapshot-archiver sidecar to each peer pod. It takes Fabric
# ledger snapshots to the static S3 bucket and joins a peer from one; the
# peer pods need an IAM role for S3: set k8s_fabric_peer_service_account_iam_role_arns
# and k8s_fabric_peer_service_account to the same service account. How to use it:
# https://docs.luthersystems.com/deployment/fabric-snapshot-archiver
k8s_fabric_peer_use_snapshot_archiver: false
k8s_fabric_peer_snapshot_archiver_version: "v0.0.9"
# Scheduled snapshots to S3 (luthersystems/mars#338). Needs
# k8s_fabric_peer_use_snapshot_archiver. Runs on the peers whose index is in
# k8s_fabric_peer_snapshot_archiver_schedule_peers, peer0 by default: every
# peer has the same ledger, so one peer is enough. Turn it on for one org
# only, too: every org writes to the same S3 prefix, so two orgs upload the
# same channel twice and each prunes the other's archives. It is off on a
# peer in recovery mode, where a person restores the ledger by hand. The S3
# role needs s3:DeleteObject on the snapshot prefix to keep only the newest
# k8s_fabric_peer_snapshot_archiver_keep_archives archives (0 keeps all).
k8s_fabric_peer_snapshot_archiver_schedule: false
# The first archiver release with serve --snapshot-schedule. The role
# refuses to turn the schedule on with an older image, which would
# crash-loop the sidecar.
k8s_fabric_peer_snapshot_archiver_schedule_min_version: "v0.0.9"
k8s_fabric_peer_snapshot_archiver_schedule_peers: [0]
k8s_fabric_peer_snapshot_archiver_cron: "0 2 * * *"
k8s_fabric_peer_snapshot_archiver_keep_archives: 14
k8s_fabric_peer_snapshot_archiver_timeout: 2h
k8s_fabric_peer_snapshot_archiver_channel: luther

k8s_fabric_peer_service_account_iam_role_arns: {}
k8s_fabric_peer_service_account: default

k8s_fabric_peer_storage_size_overrides: []
k8s_fabric_peer_recovery_overrides: []
