---
# tasks file for k8s_fabric_peer

# A mistake in the schedule settings fails here, before any change. It must
# not turn the schedule off silently (the missed-snapshot alert then has no
# series and stays quiet), nor crash-loop the archiver sidecar, which takes
# the whole peer pod out of its Service.
- name: Snapshot schedule settings are valid
  when: k8s_fabric_peer_snapshot_archiver_schedule | bool
  assert:
    that:
      - k8s_fabric_peer_use_snapshot_archiver | bool
      - k8s_fabric_peer_snapshot_archiver_schedule_peers is sequence
      - k8s_fabric_peer_snapshot_archiver_schedule_peers is not string
      - k8s_fabric_peer_snapshot_archiver_schedule_peers | length > 0
      - (k8s_fabric_peer_snapshot_archiver_schedule_peers | map('int') | max) < (k8s_fabric_peer_org_size | int)
      - (k8s_fabric_peer_snapshot_archiver_schedule_peers | map('int') | min) >= 0
      - k8s_fabric_peer_snapshot_archiver_timeout is string
      - k8s_fabric_peer_snapshot_archiver_timeout is match('^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$')
      - (k8s_fabric_peer_snapshot_archiver_version | regex_replace('^v', '')) is version(k8s_fabric_peer_snapshot_archiver_schedule_min_version | regex_replace('^v', ''), '>=')
    fail_msg: >-
      k8s_fabric_peer_snapshot_archiver_schedule needs
      k8s_fabric_peer_use_snapshot_archiver, a non-empty list of peer
      indexes below k8s_fabric_peer_org_size in
      k8s_fabric_peer_snapshot_archiver_schedule_peers, a Go duration with a
      unit in k8s_fabric_peer_snapshot_archiver_timeout (for example 2h),
      and k8s_fabric_peer_snapshot_archiver_version
      {{ k8s_fabric_peer_snapshot_archiver_schedule_min_version }} or later
      (the first archiver with serve --snapshot-schedule).

- name: K8s namespace exists
  k8s:
    name: "{{k8s_fabric_peer_namespace}}"
    api_version: v1
    kind: Namespace
    state: present
  environment: "{{ kubectl_env }}"

- name: ConfigMap directory exists
  # Stages files on the deploy host only. Run it in check mode too, because
  # the cluster tasks after it read these files.
  check_mode: false
  file:
    path: "{{k8s_fabric_peer_configmap_path | dirname}}"
    state: directory

- name: ConfigMap is rendered
  # Stages files on the deploy host only. Run it in check mode too, because
  # the cluster tasks after it read these files.
  check_mode: false
  template:
    src: configmap.yaml.j2
    dest: "{{k8s_fabric_peer_configmap_path}}"

- name: K8s ConfigMap exists
  k8s:
    src: "{{k8s_fabric_peer_configmap_path}}"
  environment: "{{ kubectl_env }}"

- name: retrieve peer PV data
  include_role:
    name: k8s_pv_data
  vars:
    org_selector: "fabric/organization={{k8s_fabric_peer_org}}"
    k8s_pv_data_selectors: "{{k8s_fabric_peer_pv_selectors + [org_selector]}}"

- name: Fabric crypto-config secrets exists
  k8s:
    namespace: "{{k8s_fabric_peer_namespace}}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{k8s_fabric_peer_crypto_config_secret_name}}"
      type: Opaque
      data:
        crypto-config.zip: "{{k8s_fabric_peer_crypto_config}}"
  no_log: True
  environment: "{{ kubectl_env }}"
  when: k8s_fabric_peer_crypto_config | default('') | length > 0

- name: Create Fabric Peer Service Accounts
  k8s:
    namespace: "{{k8s_fabric_peer_namespace}}"
    definition:
      apiVersion: v1
      kind: ServiceAccount
      automountServiceAccountToken: true
      metadata:
        name: "{{ item.key }}"
        annotations:
          eks.amazonaws.com/role-arn: "{{ item.value }}"
  environment: "{{ kubectl_env }}"
  loop: "{{ k8s_fabric_peer_service_account_iam_role_arns | dict2items }}"

- name: Helm chart exists
  # Stages files on the deploy host only. Run it in check mode too, because
  # the cluster tasks after it read these files.
  check_mode: false
  synchronize:
    src: fabric-peer/
    dest: "{{k8s_fabric_peer_helm_chart_path}}"
    delete: yes
    recursive: yes
    owner: no
    group: no
    use_ssh_args: yes

- name: Loop is run
  include_tasks: inner.yml
  loop: "{{ range(0, k8s_fabric_peer_org_size | int) | list }}"
