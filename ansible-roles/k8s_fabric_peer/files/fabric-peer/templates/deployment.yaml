apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fabric-peer.fullname" . }}
  labels:
    {{- include "fabric-peer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
    rollingUpdate: !!null
  selector:
    matchLabels:
      {{- include "fabric-peer.match-labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fabric-peer.labels" . | nindent 8 }}
      {{- with include "fabric-peer.checksum-annotations" . }}{{ . | nindent 6 }}{{ end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fabric-peer.serviceAccountName" . }}
      volumes:
        {{- if .Values.externalChaincode }}
        - name: buildpacks
          emptyDir: {}
        {{- end }}
        {{- if .Values.dockerChaincode }}
        - name: docker-tls
          emptyDir: {}
        - name: chaincode-archives
          emptyDir: {}
        - name: docker-storage
          persistentVolumeClaim:
            claimName: {{ list "dockerstorage" . | include "fabric-peer.pvc" }}
        {{- end }}
        - name: genesisblock
          emptyDir: {}
        - name: orderertls
          emptyDir: {}
        - name: msp
          emptyDir: {}
        - name: adminmsp
          emptyDir: {}
        - name: tls
          emptyDir: {}
        - name: config
          configMap:
            name: {{ .Values.coreConfigMap }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ list "storage" . | include "fabric-peer.pvc" }}
        {{- if .Values.blockArchive.enabled }}
        - name: blockarchive
          persistentVolumeClaim:
            claimName: {{ list "blockarchive" . | include "fabric-peer.pvc" }}
        {{- end }}
        {{- if .Values.dlt.cryptoConfigSecret }}
        - name: fabric-crypto-config
          secret:
            secretName: {{ .Values.dlt.cryptoConfigSecret }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.global.hyperledger.fabricVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.startService }}
          args:
            - peer
            - node
            - start
          {{- else }}
          command:
            - /bin/sh
            - -c
            - sleep infinity
          {{- end }}
          env:
            - name: FABRIC_CFG_PATH
              value: /etc/hyperledger/fabric/
            {{- if .Values.logGrpc }}
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_GO_LOG_SEVERITY_LEVEL
              value: info
            {{- end }}
            - name: PEER_INDEX
              value: "{{ .Values.dlt.peerIndex }}"
            - name: CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG
              value: {{ include "fabric-peer.chaincodeBuilderConfig" . }}
            - name: FABRIC_LOGGING_SPEC
              value: {{ .Values.logLevel }}
            - name: CORE_PEER_ADDRESS
              value: {{ include "fabric-peer.self-fqdn" . }}:{{ .Values.internal.container.gossipPort }}
            - name: CORE_PEER_KEEPALIVE_MININTERVAL
              value: {{ .Values.internal.container.keepaliveMinInterval }}
            - name: CORE_PEER_KEEPALIVE_CLIENT_INTERVAL
              value: {{ .Values.internal.container.keepaliveClientInterval }}
            - name: CORE_PEER_KEEPALIVE_DELIVERYCLIENT_INTERVAL
              value: {{ .Values.internal.container.keepaliveDeliveryClientInterval }}
            - name: CORE_PEER_GOSSIP_EXTERNALENDPOINT
              value: {{ include "fabric-peer.self-fqdn" . }}:{{ .Values.internal.container.gossipPort }}
            - name: CORE_PEER_GOSSIP_BOOTSTRAP
              value: {{ list 0 . | include "fabric-peer.fqdn" }}:{{ .Values.internal.container.gossipPort }}
            - name: CORE_PEER_CHAINCODELISTENADDRESS
              value: "localhost:{{ .Values.internal.container.chaincodePort }}"
            - name: CORE_PEER_GOSSIP_ORGLEADER
              value: "true"
            - name: CORE_PEER_GOSSIP_USELEADERELECTION
              value: "false"
            - name: CORE_PEER_GOSSIP_STATE_ENABLED
              value: "false"
            - name: CORE_PEER_DELIVERYCLIENT_BLOCKGOSSIPENABLED
              value: "false"
            - name: CORE_PEER_ID
              value: {{ include "fabric-peer.self-fqdn" . }}
            - name: CORE_PEER_LOCALMSPID
              value: {{ .Values.dlt.mspID }}
            - name: CORE_PEER_PROFILE_ENABLED
              value: "true"
            - name: CORE_PEER_TLS_ENABLED
              value: "true"
            - name: CORE_PEER_TLS_CERT_FILE
              value: /etc/hyperledger/fabric/tls/server.crt
            - name: CORE_PEER_TLS_CLIENTCERT_FILE
              value: /etc/hyperledger/fabric/tls/server.crt
            - name: CORE_PEER_TLS_KEY_FILE
              value: /etc/hyperledger/fabric/tls/server.key
            - name: CORE_PEER_TLS_CLIENTKEY_FILE
              value: /etc/hyperledger/fabric/tls/server.key
            - name: CORE_PEER_TLS_ROOTCERT_FILE
              value: /etc/hyperledger/fabric/tls/ca.crt
            - name: CORE_PEER_TLS_CLIENTROOTCAS_FILES
              value: /etc/hyperledger/fabric/tls/ca.crt
            - name: CORE_PEER_MSPCONFIGPATH
              value: /etc/hyperledger/fabric/msp
            {{- if .Values.dockerChaincode }}
            - name: CORE_VM_ENDPOINT
              value: http://localhost:2376
            - name: CORE_VM_DOCKER_TLS_ENABLED
              value: "true"
            - name: CORE_VM_DOCKER_TLS_CA_FILE
              value: /docker-tls/client/ca.pem
            - name: CORE_VM_DOCKER_TLS_CERT_FILE
              value: /docker-tls/client/cert.pem
            - name: CORE_VM_DOCKER_TLS_KEY_FILE
              value: /docker-tls/client/key.pem
            {{- if .Values.chaincode.resourceLimits.memory }}
            - name: CORE_VM_DOCKER_HOSTCONFIG_MEMORY
              value: {{ .Values.chaincode.resourceLimits.memory | int64 | toString | quote }}
            {{- end }}
            {{- end }}
            - name: CORE_OPERATIONS_LISTENADDRESS
              value: "0.0.0.0:{{ .Values.internal.container.operationsPort }}"
            - name: CORE_METRICS_PROVIDER
              value: prometheus
            - name: CORE_CHAINCODE_EXECUTETIMEOUT
              value: {{ .Values.internal.container.invokeTimeout }}
            - name: CORE_PEER_GOSSIP_PVTDATA_PUSHACKTIMEOUT
              value: {{ .Values.internal.container.invokeTimeout }}
            {{- /* Only a Docker chaincode peer builds or runs chaincode in these
            images. Rendering them for an external or ccaas peer would
            restart it on every chaincode image bump for nothing. */}}
            {{- if .Values.dockerChaincode }}
            - name: CORE_CHAINCODE_BUILDER
              value: {{ include "fabric-peer.chaincode-builder" . | quote }}
            {{- with include "fabric-peer.chaincode-golang-runtime" . }}
            - name: CORE_CHAINCODE_GOLANG_RUNTIME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: CORE_CHAINCODE_STARTUPTIMEOUT
              value: 500s
          ports:
            - name: grpc-svc
              containerPort: {{ .Values.internal.container.servicePort }}
              protocol: TCP
            - name: grpc-cc
              containerPort: {{ .Values.internal.container.chaincodePort }}
              protocol: TCP
            - name: grpc-gossip
              containerPort: {{ .Values.internal.container.gossipPort }}
              protocol: TCP
            - name: http-op
              containerPort: {{ .Values.internal.container.operationsPort }}
              protocol: TCP
          {{- if and .Values.startProbes .Values.startService }}
          # Each probe comes from values.yaml (probes.*), which explains the
          # timings. null turns a probe off; a handler there replaces httpGet.
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- if not (or .httpGet .exec .tcpSocket .grpc) }}
            httpGet:
              path: /healthz
              port: http-op
            {{- end }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- if not (or .httpGet .exec .tcpSocket .grpc) }}
            httpGet:
              path: /healthz
              port: http-op
            {{- end }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- if not (or .httpGet .exec .tcpSocket .grpc) }}
            httpGet:
              path: /healthz
              port: http-op
            {{- end }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          volumeMounts:
            {{- if .Values.externalChaincode }}
            - name: buildpacks
              mountPath: /buildpacks
            {{- end }}
            {{- if .Values.dockerChaincode }}
            - name: docker-tls
              mountPath: /docker-tls
            - name: chaincode-archives
              mountPath: /opt/gopath/src/github.com/hyperledger/fabric/examples/chaincode/go
            {{- end }}
            - name: genesisblock
              mountPath: /opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
            - name: orderertls
              mountPath: /opt/gopath/src/github.com/hyperledger/fabric/peer/orderertls
            - name: config
              subPath: core.yaml
              mountPath: /etc/hyperledger/fabric/core.yaml
            - name: msp
              mountPath: /etc/hyperledger/fabric/msp
            - name: tls
              mountPath: /etc/hyperledger/fabric/tls
            - name: storage
              mountPath: /var/hyperledger/production
            {{- if .Values.blockArchive.enabled }}
            # The archived block files, behind the symlinks the
            # block-archiver leaves in the ledger: the same path in both.
            - name: blockarchive
              mountPath: {{ .Values.blockArchive.mountPath }}
            {{- end }}
          workingDir: /opt/gopath/src/github.com/hyperledger/fabric/peer
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.dockerChaincode }}
        - name: docker-chaincodes
          image: "luthersystems/dind:{{ .Values.dindVersion }}"
          imagePullPolicy: Always
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /docker-tls
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
            - name: docker-tls
              mountPath: /docker-tls
        {{- end }}
        {{- if .Values.blockArchive.enabled }}
        # Moves sealed block files from the fast storage volume to the cheap
        # blockarchive volume and leaves symlinks (fabric-snapshot-archiver
        # archive-blocks). Fabric never writes a sealed file again, so the
        # peer keeps running; it reads old blocks through the symlinks.
        {{- $interval := toString .Values.blockArchive.interval }}
        {{- if not (regexMatch "^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$" $interval) }}
        {{- fail (printf "blockArchive.interval %q is not a Go duration with a unit, for example 60s" $interval) }}
        {{- end }}
        - name: block-archiver
          image: "{{ .Values.fabricSnapshotArchiver.image.repository }}:{{ .Values.fabricSnapshotArchiver.image.version }}"
          imagePullPolicy: {{ .Values.fabricSnapshotArchiver.image.pullPolicy }}
          args:
            - archive-blocks
            - --ledger-path=/var/hyperledger/production
            - {{ printf "--archive-path=%s" .Values.blockArchive.mountPath | quote }}
            - {{ printf "--interval=%s" $interval | quote }}
            - {{ printf "--max-mb-per-second=%v" .Values.blockArchive.maxMBPerSecond | quote }}
          volumeMounts:
            - name: storage
              mountPath: /var/hyperledger/production
            - name: blockarchive
              mountPath: {{ .Values.blockArchive.mountPath }}
          resources:
            {{- toYaml .Values.blockArchive.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.fabricSnapshotArchiver.enabled }}
        - name: fabric-snapshot-archiver
          image: "{{ .Values.fabricSnapshotArchiver.image.repository }}:{{ .Values.fabricSnapshotArchiver.image.version }}"
          imagePullPolicy: {{ .Values.fabricSnapshotArchiver.image.pullPolicy }}
          {{- $schedule := .Values.fabricSnapshotArchiver.schedule }}
          {{- if $schedule.enabled }}
          # serve takes a snapshot on the schedule and uploads it
          # (luthersystems/fabric-snapshot-archiver#36). Its API has no
          # authentication and can start a restore, so it listens on
          # localhost only; reach it with kubectl exec or port-forward. Only
          # /metrics listens on the pod IP, for Prometheus. No command: the
          # image's entrypoint is the archiver.
          args:
            - serve
            - {{ printf "--channel=%s" (required "fabricSnapshotArchiver.channel is required" .Values.fabricSnapshotArchiver.channel) | quote }}
            - {{ printf "--snapshot-schedule=%s" (required "fabricSnapshotArchiver.schedule.cron is required" $schedule.cron) | quote }}
            - {{ printf "--keep-archives=%v" $schedule.keepArchives | quote }}
            {{- $timeout := toString $schedule.timeout }}
            {{- if not (regexMatch "^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$" $timeout) }}
            {{- fail (printf "fabricSnapshotArchiver.schedule.timeout %q is not a Go duration with a unit, for example 2h" $timeout) }}
            {{- end }}
            - {{ printf "--timeout=%s" $timeout | quote }}
            - --grpc-addr=127.0.0.1:50051
            - --http-addr=127.0.0.1:8080
            - {{ printf "--metrics-addr=:%v" .Values.fabricSnapshotArchiver.metricsPort | quote }}
          ports:
            - name: http-archiver
              containerPort: {{ .Values.fabricSnapshotArchiver.metricsPort }}
              protocol: TCP
          {{- else }}
          # No schedule: the container idles, for snapshots and restores run
          # by hand with kubectl exec.
          command:
            - /bin/sh
            - -c
            - sleep infinity
          {{- end }}
          env:
            - name: AWS_REGION
              value: {{ .Values.global.aws.region }}
            - name: S3_BUCKET
              value: {{ .Values.global.aws.staticBucket }}
            - name: S3_BUCKET_PREFIX
              value: "{{ .Values.global.lutherEnv }}/fabric-snapshots"
            - name: FABRIC_CFG_PATH
              value: /etc/hyperledger/fabric/
            - name: FABRIC_LOGGING_SPEC
              value: INFO
            - name: CORE_PEER_ADDRESS
              value: {{ include "fabric-peer.self-fqdn" . }}:{{ .Values.internal.container.gossipPort }}
            - name: CORE_PEER_ID
              value: fabric-snapshot-archiver
            - name: CORE_PEER_LOCALMSPID
              value: {{ .Values.dlt.mspID }}
            - name: CORE_PEER_TLS_ENABLED
              value: "true"
            - name: CORE_PEER_TLS_CLIENTAUTHREQUIRED
              value: "true"
            - name: CORE_PEER_TLS_CERT_FILE
              value: /etc/hyperledger/fabric/tls/server.crt
            - name: CORE_PEER_TLS_KEY_FILE
              value: /etc/hyperledger/fabric/tls/server.key
            - name: CORE_PEER_TLS_CLIENTCERT_FILE
              value: /etc/hyperledger/fabric/tls/server.crt
            - name: CORE_PEER_TLS_CLIENTKEY_FILE
              value: /etc/hyperledger/fabric/tls/server.key
            - name: CORE_PEER_TLS_ROOTCERT_FILE
              value: /etc/hyperledger/fabric/tls/ca.crt
            - name: CORE_PEER_MSPCONFIGPATH
              value: /etc/hyperledger/fabric/msp
          volumeMounts:
            - name: config
              subPath: core.yaml
              mountPath: /etc/hyperledger/fabric/core.yaml
            - name: adminmsp
              mountPath: /etc/hyperledger/fabric/msp
            - name: tls
              mountPath: /etc/hyperledger/fabric/tls
            - name: storage
              mountPath: /var/hyperledger/production
          workingDir: /opt/gopath/src/github.com/hyperledger/fabric/peer
          resources:
            {{- toYaml .Values.fabricSnapshotArchiver.resources | nindent 12 }}
        {{- end }}
      initContainers:
        {{- if .Values.externalChaincode }}
        - name: install-buildpack
          image: "{{ .Values.buildpackImage.repository }}:{{ .Values.buildpackImage.version }}"
          args:
            - /buildpacks/substrate
          volumeMounts:
            - name: buildpacks
              mountPath: /buildpacks
        {{- end }}
        {{- if .Values.dockerChaincode }}
        # chaincode-archive-bootstrap fetches the substrate archive once, at pod
        # start, so a new substrate version needs a pod restart. Substrate
        # upgrades already need downtime, so a syncing sidecar would gain nothing.
        - name: chaincode-archive-bootstrap
          image: "luthersystems/awscli:{{ .Values.awsCLIVersion }}"
          env:
            - name: AWS_REGION
              value: {{ .Values.substrate.s3.region }}
            - name: S3_BUCKET
              value: {{ .Values.substrate.s3.bucket }}
          command: ["sh", "-c"]
          args:
            - |
              set -xe;
              aws s3 cp "s3://{{ .Values.substrate.s3.bucket }}/chaincodes/com_luthersystems_chaincode_substrate01-{{ .Values.substrate.version }}.tar.gz" /chaincodes/com_luthersystems_chaincode_substrate01-{{ .Values.substrate.version }}.tar.gz
          volumeMounts:
            - name: chaincode-archives
              mountPath: /chaincodes
        {{- end }}
        {{- if .Values.dlt.cryptoConfigSecret }}
        - name: config-setup
          image: busybox:1.35.0
          args:
            - sh
            - -c
            - |
              set -xe;
              cp /opt/crypto-config/crypto-config.zip /tmp
              cd /tmp
              unzip crypto-config.zip
              cd crypto-config
              cp -a ordererOrganizations/{{ include "fabric-peer.orderer-domain" . }}/orderers/orderer0.{{ include "fabric-peer.orderer-domain" . }}/msp/tlscacerts/. /orderertls/
              cp -a peerOrganizations/{{ .Values.dlt.organization }}.{{ .Values.dlt.domain }}/peers/{{ include "fabric-peer.self-fqdn" . }}/msp/. /msp/
              cp -a peerOrganizations/{{ .Values.dlt.organization }}.{{ .Values.dlt.domain }}/peers/{{ include "fabric-peer.self-fqdn" . }}/tls/. /tls/
              cp -a peerOrganizations/{{ .Values.dlt.organization }}.{{ .Values.dlt.domain }}/users/Admin@{{ .Values.dlt.organization }}.{{ .Values.dlt.domain }}/msp/. /adminmsp/
          volumeMounts:
            - name: orderertls
              mountPath: /orderertls
            - name: msp
              mountPath: /msp
            - name: adminmsp
              mountPath: /adminmsp
            - name: tls
              mountPath: /tls
            - name: fabric-crypto-config
              mountPath: /opt/crypto-config
              readOnly: true
        {{- else }}
        - name: config-fetch
          image: "luthersystems/awscli:{{ .Values.awsCLIVersion }}"
          env:
            - name: AWS_REGION
              value: {{ .Values.global.aws.region }}
            - name: S3_BUCKET
              value: {{ .Values.global.aws.staticBucket }}
          command: ["sh", "-c"]
          args:
            - |
              set -xe;
              aws s3 cp --recursive "s3://{{ .Values.global.aws.staticBucket }}/{{ .Values.global.lutherEnv }}/fabric-artifacts/crypto-config/ordererOrganizations/{{ include "fabric-peer.orderer-domain" . }}/orderers/orderer0.{{ include "fabric-peer.orderer-domain" . }}/msp/tlscacerts/" /orderertls
              aws s3 cp --recursive "s3://{{ .Values.global.aws.staticBucket }}/{{ .Values.global.lutherEnv }}/fabric-artifacts/crypto-config/peerOrganizations/{{ .Values.dlt.organization }}.{{ .Values.dlt.domain }}/peers/{{ include "fabric-peer.self-fqdn" . }}/msp/" /msp
              aws s3 cp --recursive "s3://{{ .Values.global.aws.staticBucket }}/{{ .Values.global.lutherEnv }}/fabric-artifacts/crypto-config/peerOrganizations/{{ .Values.dlt.organization }}.{{ .Values.dlt.domain }}/peers/{{ include "fabric-peer.self-fqdn" . }}/tls/" /tls
              aws s3 cp --recursive "s3://{{ .Values.global.aws.staticBucket }}/{{ .Values.global.lutherEnv }}/fabric-artifacts/crypto-config/peerOrganizations/{{ .Values.dlt.organization }}.{{ .Values.dlt.domain }}/users/Admin@{{ .Values.dlt.organization }}.{{ .Values.dlt.domain }}/msp/" /adminmsp
          volumeMounts:
            - name: orderertls
              mountPath: /orderertls
            - name: msp
              mountPath: /msp
            - name: adminmsp
              mountPath: /adminmsp
            - name: tls
              mountPath: /tls
        {{- end }}
      {{- if not .Values.local }}
      nodeSelector:
        topology.kubernetes.io/zone: {{ .Values.availabilityZone }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
