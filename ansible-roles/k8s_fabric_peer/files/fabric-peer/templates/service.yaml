apiVersion: v1
kind: Service
metadata:
  name: {{ include "fabric-peer.fullname" . }}
  labels:
    {{- include "fabric-peer.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ include "fabric-peer.self-fqdn" . }}
    {{- if eq .Values.service.type "LoadBalancer" }}
    {{- if .Values.service.useNLB }}
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    {{- else }}
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: {{ .Values.service.idleTimeout | quote }}
    {{- end }}
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: Project={{ .Values.global.lutherProjectID }},Environment={{ .Values.global.lutherEnv }},Organization={{ .Values.dlt.organization }},Component={{.Values.dlt.component}},Resource=elb
    {{- if .Values.service.useNLB }}
    {{- /* Health check the operations port (/healthz). It is not a listener
    on the load balancer: with ip targets the NLB checks the pod port
    directly. A plain TCP check on the TLS peer port would log a failed TLS
    handshake for every probe. The classic ELB checks a NodePort, and 9443 is
    not a Service port, so it keeps its default check. */}}
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: {{ .Values.internal.container.operationsPort | quote }}
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz
    {{- end }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.internal.container.gossipPort }}
      targetPort: grpc-gossip
      protocol: TCP
      name: grpc-gossip
    - port: {{ .Values.service.port }}
      targetPort: grpc-svc
      protocol: TCP
      name: grpc-svc
  selector:
    app.kubernetes.io/name: {{ include "fabric-peer.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# The operations port (metrics, /healthz) is for in-cluster use only. It has
# its own ClusterIP service, so it is never published on the load balancer.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-ops" (include "fabric-peer.fullname" . | trunc 59 | trimSuffix "-") }}
  labels:
    {{- include "fabric-peer.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.internal.container.operationsPort | quote }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.internal.container.operationsPort }}
      targetPort: http-op
      protocol: TCP
      name: http-op
  selector:
    app.kubernetes.io/name: {{ include "fabric-peer.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
