{{- if .Values.blockArchive.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fabric-peer.fullname" . }}-block-archiver
  labels:
    {{- include "fabric-peer.labels" . | nindent 4 }}
data:
  block-archiver.sh: |-
{{ .Files.Get "files/block-archiver.sh" | indent 4 }}
{{- if .Values.persistentVolume.create }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ list "blockarchive" . | include "fabric-peer.pvc" }}
  labels:
    {{- include "fabric-peer.labels" . | nindent 4 }}
  {{- if .Values.blockArchive.typeOverride }}
  annotations:
    ebs.csi.aws.com/volumeType: {{ .Values.blockArchive.typeOverride }}
  {{- end }}
spec:
  storageClassName: {{ .Values.blockArchive.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.blockArchive.storageSize }}
{{- end }}
{{- end }}
