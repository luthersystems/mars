apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pushprox.fullname" . }}-test-connection"
  labels:
{{ include "pushprox.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: wget
      image: busybox
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: ['wget']
      # /probe: the proxy answers 404 for any other path.
      args:  ['-O', '-', '{{ include "pushprox.fullname" . }}:{{ .Values.service.port }}/probe']
  restartPolicy: Never
