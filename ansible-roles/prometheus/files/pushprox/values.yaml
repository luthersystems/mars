# Default values for pushprox.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: luthersystems/pushprox
  # Empty tag means Chart.yaml appVersion, so the version lives in one
  # place. From v0.1.0 the image runs as nobody (uid 65534) under tini, on
  # the hardened service-base-alpine base. The chart sets no command or
  # args, so the image's default "--listen=:8080" applies; 8080 is not a
  # privileged port, so nobody can bind it.
  tag: ""
  # The digest of the appVersion's multi-arch index. A re-run of the
  # pushproxng release can push the tag again, so the digest keeps every
  # node on the same build. Change it with appVersion.
  digest: sha256:9ade96885352cb4bcb7df6e55065aae0ffd84ea4258d1c470b4bc2ba6ef4ca76
  # IfNotPresent: the digest fixes the image, so a pod restart need not
  # pull from Docker Hub (rate limits, outages).
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

# The proxy needs no root, no capability and no writable file. runAsUser
# is numeric because the image's USER is the name "nobody": with only
# runAsNonRoot, the kubelet cannot check a user name and refuses to start
# the container.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: luthersystemsapp.com
      paths: []

  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
