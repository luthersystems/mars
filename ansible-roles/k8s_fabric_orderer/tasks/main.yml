---
# tasks file for k8s_fabric_orderer

- name: Fabric 3 orderers run without a system channel
  assert:
    that:
      - k8s_fabric_orderer_version | string | regex_replace('^v', '') is version('3.0.0', '<') or k8s_fabric_orderer_channel_participation | bool
    fail_msg: >-
      Fabric {{ k8s_fabric_orderer_version }} has no system channel. Set
      k8s_fabric_orderer_channel_participation to true, and remove the system
      channel on Fabric 2.5 before the upgrade (docs/fabric-3-upgrade.md in
      luthersystems/mars). A 3.x orderer whose ledger still has a system
      channel stops at startup.

- name: The running orderers are on this Fabric version
  include_role:
    name: k8s_fabric_version_guard
  vars:
    k8s_fabric_version_guard_namespace: "{{ k8s_fabric_orderer_namespace }}"
    k8s_fabric_version_guard_container: fabric-orderer
    k8s_fabric_version_guard_version: "{{ k8s_fabric_orderer_version }}"

- name: K8s namespace exists
  k8s:
    name: "{{k8s_fabric_orderer_namespace}}"
    api_version: v1
    kind: Namespace
    state: present
  environment: "{{ kubectl_env }}"

- name: retrieve orderer PV data
  include_role:
    name: k8s_pv_data
  vars:
    org_selector: "fabric/organization={{k8s_fabric_orderer_org}}"
    k8s_pv_data_selectors: "{{k8s_fabric_orderer_pv_selectors + [org_selector]}}"

- name: Fabric crypto-config secrets exists
  k8s:
    namespace: "{{k8s_fabric_orderer_namespace}}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{k8s_fabric_orderer_crypto_config_secret_name}}"
      type: Opaque
      data:
        crypto-config.zip: "{{k8s_fabric_orderer_crypto_config}}"
  no_log: True
  environment: "{{ kubectl_env }}"
  when: k8s_fabric_orderer_crypto_config | default('') | length > 0

- name: Fabric channel-artifacts configmap exists
  k8s:
    namespace: "{{k8s_fabric_orderer_namespace}}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{k8s_fabric_orderer_channel_artifacts_configmap_name}}"
      binaryData:
        channel-artifacts.zip: "{{k8s_fabric_orderer_channel_artifacts}}"
  environment: "{{ kubectl_env }}"
  when: k8s_fabric_orderer_channel_artifacts | default('') | length > 0

- name: Create Orderer Peer Service Accounts
  k8s:
    namespace: "{{k8s_fabric_orderer_namespace}}"
    definition:
      apiVersion: v1
      kind: ServiceAccount
      automountServiceAccountToken: true
      metadata:
        name: "{{ item.key }}"
        annotations:
          eks.amazonaws.com/role-arn: "{{ item.value }}"
  environment: "{{ kubectl_env }}"
  loop: "{{ k8s_fabric_orderer_service_account_iam_role_arns | dict2items }}"

- name: Helm chart exists
  # Stages files on the deploy host only. Run it in check mode too, because
  # the cluster tasks after it read these files.
  check_mode: false
  synchronize:
    src: fabric-orderer/
    dest: "{{k8s_fabric_orderer_helm_chart_path}}"
    delete: yes
    recursive: yes
    owner: no
    group: no
    use_ssh_args: yes

- name: Loop is run
  include_tasks: inner.yml
  loop: "{{range(0,k8s_fabric_orderer_cluster_size)|list}}"
