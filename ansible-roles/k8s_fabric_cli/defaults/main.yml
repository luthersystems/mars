---
# defaults file for k8s_fabric_cli

k8s_fabric_cli_org: org1
k8s_fabric_cli_msp: Org1MSP
k8s_fabric_cli_org_size: 1
k8s_fabric_cli_domain_root: "{{k8s_fabric_network_domain_root}}"
# Orderer org domain; empty means it shares the domain root.
k8s_fabric_cli_orderer_domain_root: "{{ k8s_fabric_network_orderer_domain_root | default('') }}"

k8s_fabric_cli_namespace: fabric-{{k8s_fabric_cli_org}}
k8s_fabric_cli_helm_chart_path: "{{kubectl_asset_root_path}}/fabric-cli"

k8s_fabric_cli_substrate_version: ""
k8s_fabric_cli_cert_bucket: ""
k8s_fabric_cli_cert_bucket_region: ""
k8s_fabric_cli_azs: []

k8s_fabric_cli_chaincode_docker: true

k8s_fabric_cli_crypto_config: ""
k8s_fabric_cli_crypto_config_secret_name: ""

k8s_fabric_cli_channel_artifacts: ""
k8s_fabric_cli_channel_artifacts_configmap_name: ""

k8s_fabric_cli_collections: ""
k8s_fabric_cli_collections_configmap_name: ""

k8s_fabric_cli_version: "{{k8s_fabric_version}}"

# The CLI image. luthersystems/fabric-tools is hyperledger/fabric-tools 2.5.6
# with the build-harden kit run (luthersystems/buildenv), tagged with the
# buildenv release. A network on a Fabric release older than 2.5 sets the
# repository to hyperledger/fabric-tools and the tag to "": an empty tag
# uses k8s_fabric_cli_version.
k8s_fabric_cli_image_repository: luthersystems/fabric-tools
k8s_fabric_cli_image_tag: "{{ luther_buildenv_images_version }}"

k8s_fabric_cli_aws_cli_version: "{{ luther_buildenv_images_version }}"

k8s_fabric_cli_service_account_iam_role_arns: {}
k8s_fabric_cli_service_account: default
