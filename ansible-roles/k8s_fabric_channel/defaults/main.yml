---
# defaults file for k8s_fabric_channel

k8s_fabric_channel_create_script_path: "{{k8s_fabric_scripts_dir}}/create-channel.sh"
k8s_fabric_channel_sync_script_path: "{{k8s_fabric_scripts_dir}}/sync-channel.sh"
k8s_fabric_channel_anchor_script_path: "{{k8s_fabric_scripts_dir}}/anchor-peers.sh"
k8s_fabric_channel_orgs:
  - name: org1
    msp: Org1MSP
  - name: org2
    msp: Org2MSP
  - name: org3
    msp: Org3MSP
  - name: org4
    msp: Org4MSP
k8s_fabric_channel_domain_root: "luther.systems"
# Orderer org domain; empty means it shares the domain root.
k8s_fabric_channel_orderer_domain_root: "{{ k8s_fabric_network_orderer_domain_root | default('') }}"
