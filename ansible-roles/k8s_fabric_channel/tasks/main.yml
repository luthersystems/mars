---
# tasks file for k8s_fabric_channel

- name: Orderer count is set for channel participation
  when: k8s_fabric_channel_participation | bool
  assert:
    that:
      - k8s_fabric_channel_orderer_count | string is match('^[1-9][0-9]*$')
    fail_msg: >-
      With channel participation the orderers join the channel one by one.
      Set k8s_fabric_orderer_cluster_size (or k8s_fabric_channel_orderer_count)
      to the number of orderers.

- name: Create channel
  command:
    argv:
      - "{{k8s_fabric_channel_create_script_path}}"
    chdir: "{{k8s_fabric_scripts_workdir}}"
  vars:
    extra_env_vars:
      FABRIC_DOMAIN: "{{k8s_fabric_channel_domain_root}}"
      FABRIC_ORDERER_DOMAIN: "{{k8s_fabric_channel_orderer_domain_root}}"
      FABRIC_ORDERER_CLIENT_AUTH: "{{ k8s_fabric_orderer_client_auth | bool | lower }}"
      CHANNEL_PARTICIPATION: "{{ k8s_fabric_channel_participation | bool | lower }}"
      ORDERERC: "{{ k8s_fabric_channel_orderer_count }}"
      ORDERER_NAMESPACE: "{{ k8s_fabric_channel_orderer_namespace }}"
  environment: "{{ kubectl_env | combine(extra_env_vars) }}"

- name: Join channel
  command:
    argv:
      - "{{k8s_fabric_channel_sync_script_path}}"
      - "{{item.name}}"
    chdir: "{{k8s_fabric_scripts_workdir}}"
  vars:
    extra_env_vars:
      FABRIC_DOMAIN: "{{k8s_fabric_channel_domain_root}}"
      FABRIC_ORDERER_DOMAIN: "{{k8s_fabric_channel_orderer_domain_root}}"
      FABRIC_ORDERER_CLIENT_AUTH: "{{ k8s_fabric_orderer_client_auth | bool | lower }}"
  environment: "{{ kubectl_env | combine(extra_env_vars) }}"
  loop: "{{k8s_fabric_channel_orgs}}"

- name: Update Anchor peers
  command:
    argv:
      - "{{k8s_fabric_channel_anchor_script_path}}"
      - "{{item.name}}"
      - "{{item.msp}}"
    chdir: "{{k8s_fabric_scripts_workdir}}"
  vars:
    extra_env_vars:
      FABRIC_DOMAIN: "{{k8s_fabric_channel_domain_root}}"
      FABRIC_ORDERER_DOMAIN: "{{k8s_fabric_channel_orderer_domain_root}}"
      FABRIC_ORDERER_CLIENT_AUTH: "{{ k8s_fabric_orderer_client_auth | bool | lower }}"
  environment: "{{ kubectl_env | combine(extra_env_vars) }}"
  loop: "{{k8s_fabric_channel_orgs}}"
