name: Build Release and Push
on:
  push:
    tags:
      - "*"
jobs:
  # A plain vX.Y.Z tag moves :latest and the ui-infrastructure pin. Refuse a
  # tag that is not on main. A pre-release tag (one with a '-', such as
  # v0.95.1-SNAPSHOT.1 cut from a branch) is not checked; it moves neither
  # :latest (push-manifests) nor the pin (deploy-platform).
  require-main:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Require release tag to be on main
        run: |
          set -eu
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "$GITHUB_REF_NAME is a pre-release tag; not checking main"
            exit 0
          fi
          # git refuses a repo owned by another user ("dubious ownership"),
          # for example in a build container that runs as root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::Release tag must point to a commit on main"
            exit 1
          }
  build-push:
    needs:
      - require-main
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    name: ${{ matrix.image }} - ${{ matrix.arch }} docker build
    runs-on: ${{ fromJSON('{"arm64":"ubuntu-22.04-arm","amd64":"ubuntu-22.04"}')[matrix.arch] }}
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - mars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # include tags for VERSION detection
      - name: Build container
        uses: ./.github/actions/build-docker-images
        timeout-minutes: 60 # the Docker Hub OIDC token lasts 60 minutes
        with:
          arch: ${{ matrix.arch }}
          image: .
          git_tag: $GITHUB_REF_NAME
      # Check the image this tag ships, not only the one CI built: apt
      # (google-cloud-cli is unpinned) can resolve to newer packages here,
      # and one could bring a CA bundle back. The per-arch tag is already
      # pushed by now, but a failure here stops push-manifests, so the
      # release tag, :latest and the ui-infrastructure pin never point at
      # the image. The shared action is the one copy of the check for every
      # repo (see mars-ci.yml).
      - name: Verify build-harden
        uses: luthersystems/.github/actions/harden-check@v1
        with:
          dockerfiles: Dockerfile
          # The tag holds the one platform this job built.
          images: luthersystems/mars:${{ github.ref_name }} linux/${{ matrix.arch }}
  push-manifests:
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    runs-on: ubuntu-22.04
    needs:
      - build-push
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Create and push manifest for multiarch
        # Only a plain vX.Y.Z tag moves :latest. A pre-release tag skips
        # require-main, so it must not reach the image mars_macos.sh runs by
        # default.
        run: |
          set -euo pipefail
          push_latest=false
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            push_latest=true
          fi
          make push-manifests GIT_TAG="$GITHUB_REF_NAME" PUSH_LATEST="$push_latest"
        timeout-minutes: 60
  # Bump .mars-version in ui-infrastructure so platform-test runs this release
  # (scripts/deploy.sh). Only a plain vX.Y.Z tag deploys.
  deploy-platform:
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    needs:
      - push-manifests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
      - name: Update infra
        run: ./scripts/deploy.sh "$GITHUB_REF_NAME"
