name: Build Release and Push
on:
  push:
    tags:
      - "*"
jobs:
  build-push:
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    name: ${{ matrix.image }} - ${{ matrix.arch }} docker build
    runs-on: ${{ fromJSON('{"arm64":"2vcpu-ubuntu-2204-arm","amd64":"ubuntu-22.04"}')[matrix.arch] }}
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - mars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # include tags for VERSION detection
      - name: Build container
        uses: ./.github/actions/build-docker-images
        timeout-minutes: 60 # the Docker Hub OIDC token lasts 60 minutes
        with:
          arch: ${{ matrix.arch }}
          image: .
          git_tag: $GITHUB_REF_NAME
  push-manifests:
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    runs-on: ubuntu-22.04
    needs:
      - build-push
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Create and push manifest for multiarch
        run: make push-manifests GIT_TAG=$GITHUB_REF_NAME
        timeout-minutes: 60
  # Bump .mars-version in ui-infrastructure so platform-test runs this release
  # (scripts/deploy.sh). Only a plain vX.Y.Z tag deploys.
  deploy-platform:
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    needs:
      - push-manifests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
      - name: Update infra
        run: ./scripts/deploy.sh "$GITHUB_REF_NAME"
