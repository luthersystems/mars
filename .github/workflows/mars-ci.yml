name: CI Build

on:
  pull_request:
    branches:
      - main
  # A push run on main is the CI gate mars-release-dispatch.yml waits for.
  push:
    branches:
      - main
jobs:
  # Runs the Go unit tests, which include the fast same-repo/cross-repo drift
  # guards in internal/providercache (Dockerfile bake vs "Sources of truth"
  # comment vs smoke-tf-cache.sh vs the insideout-terraform-presets composer
  # pins). Without this job those guards only ran on developer machines, so a
  # dependabot bump of the presets module — or a bake bump — could merge
  # without ever exercising them.
  go-test:
    name: go test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
  # The Fabric 2.5 to 3.x upgrade scripts and role (mars#341,
  # docs/fabric-3-upgrade.md) against a real local network: the release
  # binaries, three Raft orderers, one peer and a fake kubectl. Step 2 of the
  # runbook has no undo, so the scripts must be proven before they reach a
  # cluster.
  fabric3-upgrade:
    name: fabric 3 upgrade test
    # 24.04: its Python 3.12 runs the Ansible of the mars image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The ansible package, not ansible-core alone: the roles use
      # collection modules (ansible.posix synchronize), as in the image.
      - name: Install Ansible (the version in requirements.txt)
        run: pipx install "ansible==$(sed -n 's/^ansible==//p' requirements.txt)" --include-deps
      # PyYAML comes with Ansible.
      - name: Tasks give each Fabric script the NAMESPACE it needs
        run: "$(pipx environment --value PIPX_LOCAL_VENVS)/ansible/bin/python" scripts/check-script-env.py
      - name: Test the upgrade path
        env:
          FABRIC_BIN_CACHE: ${{ runner.temp }}/fabric-bin
        run: ./scripts/test-fabric3-upgrade.sh
  build:
    name: ${{ matrix.image }} - ${{ matrix.arch }} docker build
    runs-on: ${{ fromJSON('{"arm64":"ubuntu-22.04-arm","amd64":"ubuntu-22.04"}')[matrix.arch] }}
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - mars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # include tags for VERSION detection
      - name: Build container
        uses: ./.github/actions/build-docker-images
        with:
          arch: ${{ matrix.arch }}
          image: .
          git_rev: $GITHUB_SHA
      - name: Verify terraform provider cache
        if: matrix.image == 'mars'
        shell: bash
        run: ./scripts/smoke-tf-cache.sh "luthersystems/mars:${GITHUB_SHA}"
      - name: Verify insideout-preflight binary
        if: matrix.image == 'mars'
        shell: bash
        run: ./scripts/smoke-preflight.sh "luthersystems/mars:${GITHUB_SHA}"
      - name: Verify Helm chart rendering
        if: matrix.image == 'mars'
        shell: bash
        run: ./scripts/smoke-helm-charts.sh "luthersystems/mars:${GITHUB_SHA}"
      # The Dockerfile runs the build-harden kit last, so no distrusted root
      # CA (such as the eMudhra/emSign roots) is trusted. This proves it on
      # the Dockerfile and on the image built for each arch. The shared
      # action is the one copy of the check for every repo, so a fix reaches
      # mars when v1 moves. It reads the kit pin from the Dockerfile.
      - name: Verify build-harden
        if: matrix.image == 'mars'
        uses: luthersystems/.github/actions/harden-check@v1
        with:
          dockerfiles: Dockerfile
          # The tag holds the one platform this job built.
          images: luthersystems/mars:${{ github.sha }} linux/${{ matrix.arch }}
