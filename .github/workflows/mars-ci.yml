name: CI Build

on:
  # The merge queue runs the required checks on the merged result.
  merge_group:
  # No paths filter: the gate job below is a required check, so every PR
  # must start a run. The changes job skips the other jobs on docs-only PRs.
  pull_request:
    branches:
      - main
  # A push run on main is the CI gate mars-release-dispatch.yml waits for.
  push:
    branches:
      - main
jobs:
  # Decides whether the build and test jobs must run (scripts/ci-changes.sh).
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # On a pull request this checks out the merge commit. Its first parent
      # is the base branch tip, so depth 2 is enough for the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the decision script and the gate's needs list
        run: ./scripts/ci-changes-test.sh
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            ./scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  # Runs the Go unit tests, which include the fast same-repo/cross-repo drift
  # guards in internal/providercache (Dockerfile bake vs "Sources of truth"
  # comment vs smoke-tf-cache.sh vs the insideout-terraform-presets composer
  # pins). Without this job those guards only ran on developer machines, so a
  # dependabot bump of the presets module — or a bake bump — could merge
  # without ever exercising them.
  go-test:
    name: go test
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
  # The Fabric 2.5 to 3.x upgrade scripts and role (mars#341,
  # docs/fabric-3-upgrade.md) against a real local network: the release
  # binaries, three Raft orderers, one peer and a fake kubectl. Step 2 of the
  # runbook has no undo, so the scripts must be proven before they reach a
  # cluster.
  fabric3-upgrade:
    name: fabric 3 upgrade test
    needs: changes
    if: needs.changes.outputs.code != 'false'
    # 24.04: its Python 3.12 runs the Ansible of the mars image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The ansible package, not ansible-core alone: the roles use
      # collection modules (ansible.posix synchronize), as in the image.
      - name: Install Ansible (the version in requirements.txt)
        run: pipx install "ansible==$(sed -n 's/^ansible==//p' requirements.txt)" --include-deps
      # PyYAML comes with Ansible.
      - name: Tasks give each Fabric script the NAMESPACE it needs
        run: |
          "$(pipx environment --value PIPX_LOCAL_VENVS)/ansible/bin/python" scripts/check-script-env.py
      # The orderer and peer roles refuse a Fabric version change outside an
      # upgrade run (mars#348). A fake k8s_info stands in for the cluster.
      - name: Test the Fabric version guard
        run: ./scripts/test-fabric-version-guard.sh
      - name: Test the upgrade path
        env:
          FABRIC_BIN_CACHE: ${{ runner.temp }}/fabric-bin
        run: ./scripts/test-fabric3-upgrade.sh
  build:
    name: ${{ matrix.image }} - ${{ matrix.arch }} docker build
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ${{ fromJSON('{"arm64":"ubuntu-22.04-arm","amd64":"ubuntu-22.04"}')[matrix.arch] }}
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - mars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # include tags for VERSION detection
      - name: Build container
        uses: ./.github/actions/build-docker-images
        with:
          arch: ${{ matrix.arch }}
          image: .
          git_rev: $GITHUB_SHA
      - name: Verify terraform provider cache
        if: matrix.image == 'mars'
        shell: bash
        run: ./scripts/smoke-tf-cache.sh "luthersystems/mars:${GITHUB_SHA}"
      - name: Verify insideout-preflight binary
        if: matrix.image == 'mars'
        shell: bash
        run: ./scripts/smoke-preflight.sh "luthersystems/mars:${GITHUB_SHA}"
      - name: Verify Helm chart rendering
        if: matrix.image == 'mars'
        shell: bash
        run: ./scripts/smoke-helm-charts.sh "luthersystems/mars:${GITHUB_SHA}"
      - name: Verify the image runs as any uid
        if: matrix.image == 'mars'
        shell: bash
        run: ./scripts/smoke-any-uid.sh "luthersystems/mars:${GITHUB_SHA}"
      # The Dockerfile runs the build-harden kit last, so no distrusted root
      # CA (such as the eMudhra/emSign roots) is trusted. This proves it on
      # the Dockerfile and on the image built for each arch. The shared
      # action is the one copy of the check for every repo, so a fix reaches
      # mars when v1 moves. It reads the kit pin from the Dockerfile.
      - name: Verify build-harden
        if: matrix.image == 'mars'
        uses: luthersystems/.github/actions/harden-check@v1
        with:
          dockerfiles: Dockerfile
          # The tag holds the one platform this job built.
          images: luthersystems/mars:${{ github.sha }} linux/${{ matrix.arch }}

  ci-all:
    name: CI (all required checks)
    # always(), so the gate reports on every run. A cancelled or failed job
    # then fails the gate below. A gate that did not run, or was skipped,
    # could count as passing for the required check.
    if: always()
    needs: [changes, go-test, fabric3-upgrade, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # Pass only if the changes job succeeded and every other job succeeded,
      # or was skipped because the changes job said the PR is docs-only
      # (code=false). Any other skip fails, so a job skipped by mistake
      # cannot pass the gate.
      - name: Fail unless every required job passed
        if: >-
          needs.changes.result != 'success'
          || contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "::error::A required CI job failed, was cancelled or was skipped."
          exit 1
      - name: Every required job passed or was skipped as docs-only
        run: echo "ok"
