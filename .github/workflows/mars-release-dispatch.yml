name: Release (dispatch)

# On-demand mars release. Dispatch it from main.
#
# The `version` job picks the version: version_override when set, otherwise
# scripts/next-release-version.sh (the ONLY sanctioned auto-bump; MAJOR is
# never automated and stays human-cut). The `release` job is the org's shared
# workflow, luthersystems/.github/.github/workflows/release-tag.yml, so every
# repo gets the same checks and a fix lands once instead of in each copy. It
# refuses to tag unless the run is on live main, the push run of mars-ci.yml
# passed for that commit (it waits up to 20 minutes for one in progress), the
# commit has no release yet, and the version is vMAJOR.MINOR.PATCH without
# leading zeros, not tagged yet and newer than the latest tag of its major.
#
# release_token: claude-app, because the tag must start mars-release.yml
# (the multi-arch images, and the .mars-version bump in ui-infrastructure).
# GitHub starts no workflow for a tag the default GITHUB_TOKEN creates, so the
# official Claude App creates the release. Claude runs only the one command
# the shared workflow builds and checks. mars-release.yml also refuses a
# stable tag that is not on main.
#
# bump: patch | minor. mars's cadence is minor (v0.142.0 -> v0.143.0), so
# that is the default; patch is for a hotfix rebuild.
#
# Notes: scripts/release-notes.sh, a Markdown list of the PRs and commits on
# main since the previous tag. To change them, edit the GitHub release after
# it is cut.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which component to bump (major stays human-cut)"
        type: choice
        options:
          - minor
          - patch
        default: minor
      version_override:
        description: "Exact version to cut, e.g. v0.128.0 (optional; overrides the bump). Must be clean vMAJOR.MINOR.PATCH, newer than the latest tag, and not already tagged."
        type: string
        default: ""
      dry_run:
        description: "Validate and print the computed version, release command and notes, but do NOT cut the release"
        type: boolean
        default: false

permissions: {}

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read tags and the latest release
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, so next-release-version.sh sees prior releases
          persist-credentials: false
      - name: Pick the version
        id: pick
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            version=$VERSION_OVERRIDE
          else
            [[ "$BUMP" == patch || "$BUMP" == minor ]] || { echo "::error::bump must be patch or minor (major stays human-cut)"; exit 1; }
            version=$(scripts/next-release-version.sh "$BUMP") || { echo "::error::scripts/next-release-version.sh refused to bump; escalate to a human or set version_override"; exit 1; }
          fi
          # The shared workflow validates the version again; this keeps a bad
          # value out of the job output.
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::release version must be vX.Y.Z with no leading zeros"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release $version"

  release:
    needs: version
    # A called workflow cannot raise its caller's token permissions, so the
    # caller grants exactly what the shared workflow uses.
    permissions:
      actions: read # read the mars-ci.yml runs for the release commit
      contents: read # verify the release; the Claude App token creates it
      id-token: write # Bedrock role and the Claude App token
    uses: luthersystems/.github/.github/workflows/release-tag.yml@ecf4a077df3cc9d017ed44cafcec94d396ba308b # v1.8.0
    with:
      version: ${{ needs.version.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
      ci_workflow: mars-ci.yml
      ci_wait_minutes: 20
      release_token: claude-app
      notes_command: bash scripts/release-notes.sh
